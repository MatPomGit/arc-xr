name: ARC XR - Research manuscript validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate ARC XR E4 research protocols and provenance
        run: python3 -m unittest discover -s tests -p 'test_xr_research_protocols.py' -v

  latex-plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install LaTeX and PDF verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            latexmk lmodern texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-lang-polish poppler-utils
      - name: Compile and inspect 28 manuscripts in isolated temporary directories
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(manuscripts/MSC-*/main.tex)
          test "${#sources[@]}" -eq 28
          out="$RUNNER_TEMP/arc-xr-tex"
          mkdir -p "$out"
          count=0
          for source in "${sources[@]}"; do
            paper="$(basename "$(dirname "$source")")"
            target="$out/$paper"
            mkdir -p "$target"
            echo "::group::Compiling $paper"
            if ! latexmk -pdf -cd -interaction=nonstopmode -halt-on-error \
              -outdir="$target" \
              -pdflatex="pdflatex -no-shell-escape -file-line-error %O %S" \
              "$source" > "$target/latexmk.stdout" 2>&1; then
              echo "::error file=$source::LaTeX compilation failed"
              tail -n 100 "$target/latexmk.stdout"
              exit 1
            fi
            pdf="$target/main.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "${pages:-0}" -ge 1
            echo "PASS $paper: $pages page(s)"
            echo "::endgroup::"
            count=$((count + 1))
          done
          test "$count" -eq 28
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PASS: $count/28 valid PDFs; no generated files in the repository"

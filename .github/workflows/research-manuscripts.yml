name: ARC XR - Research manuscript validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate ARC XR E4 research protocols and provenance
        run: python3 -m unittest discover -s tests -p 'test_xr_research_protocols.py' -v

  latex-plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install LaTeX with Polish language and Latin Modern
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends latexmk lmodern texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-lang-polish
      - name: Compile 27 independent prospective manuscripts
        run: |
          set -euo pipefail
          count=0
          for f in manuscripts/MSC-*/main.tex; do
            latexmk -pdf -cd -interaction=nonstopmode -halt-on-error "$f"
            count=$((count+1))
          done
          test "$count" -eq 27
          echo "Compiled $count LaTeX manuscripts"

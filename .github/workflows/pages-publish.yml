name: Publish curated ARC-XR Pages

on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: "Explicit authorization to publish the reviewed public website"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arc-xr-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'MatPomGit/arc-xr' && github.ref == 'refs/heads/main' && inputs.publication_authorized == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Validate source and exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "MatPomGit/arc-xr"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/site_branding.py
          python3 -B scripts/validate_pages.py
          python3 -B scripts/validate_documentation.py
          python3 -B -m unittest discover -s tests -p 'test_article_catalog.py' -v
      - name: Build and inspect curated HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/arc-xr-pages"
          "$RUNNER_TEMP/arc-xr-pages/bin/python" -m pip install --disable-pip-version-check mkdocs==1.6.1
          "$RUNNER_TEMP/arc-xr-pages/bin/python" -m mkdocs build --strict --clean
          python3 -B scripts/verify_site_output.py build/site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only validated HTML
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./build/site
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

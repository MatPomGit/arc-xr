name: ARC-XR offline research contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate policy, Pages and planned research structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR HEAD in isolated runner
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Validate ARC-XR research structure
        run: python3 scripts/validate_repository.py
      - name: Check documentation budgets
        run: python3 scripts/validate_documentation.py
      - name: Verify optional ARC-XR programme branding
        run: python3 -B scripts/site_branding.py
      - name: Validate public Pages source
        run: python3 scripts/validate_pages.py
      - name: Validate GitHub Issues intake and JUMP contract
        run: python3 scripts/validate_issues.py
      - name: Audit ARC v2 migration plan without writes
        run: python3 -B scripts/audit_arc_v2_pilot.py
      - name: Install pinned research-schema validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/arc-v2"
          "${RUNNER_TEMP}/arc-v2/bin/python" -m pip install --disable-pip-version-check --no-input -r requirements-research.txt
      - name: Validate canonical ARC v2 registry and pinned TeX SHA
        run: |
          "${RUNNER_TEMP}/arc-v2/bin/python" -B scripts/validate_arc_v2_registry.py
      - name: Run all offline regression tests
        run: |
          "${RUNNER_TEMP}/arc-v2/bin/python" -m unittest discover -s tests -v
      - name: Build and verify curated GitHub Pages HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/arc-xr-mkdocs"
          "${RUNNER_TEMP}/arc-xr-mkdocs/bin/python" -m pip install --disable-pip-version-check mkdocs==1.6.1
          "${RUNNER_TEMP}/arc-xr-mkdocs/bin/python" -m mkdocs build --strict --clean
          python3 -B scripts/verify_site_output.py site

  latex:
    name: Compile all 27 XR LaTeX manuscripts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install minimal LaTeX dependencies on disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-lang-polish \
            lmodern poppler-utils
      - name: Compile and inspect all 27 PDF documents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t source_files < <(find manuscripts -mindepth 2 -maxdepth 2 \
            -type f -name main.tex | LC_ALL=C sort)
          test "${#source_files[@]}" -eq 27
          out="$RUNNER_TEMP/arc-xr-tex-build"
          mkdir -p "$out"
          completed=0
          for source in "${source_files[@]}"; do
            directory="$(dirname "$source")"
            paper="$(basename "$directory")"
            target="$out/$paper"
            mkdir -p "$target"
            if ! (cd "$directory" && pdflatex -no-shell-escape \
              -halt-on-error -file-line-error -interaction=nonstopmode \
              -output-directory="$target" main.tex > "$target/compile.stdout" 2>&1); then
              echo "::error file=$source::PDF compilation failed"
              tail -n 90 "$target/compile.stdout"
              exit 1
            fi
            pdf="$target/main.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "${pages:-0}" -ge 1
            echo "PASS $paper: $pages page(s)"
            completed=$((completed + 1))
          done
          test "$completed" -eq 27
          test -z "$(git status --porcelain)"
          echo "PASS: 27/27 PDF documents compiled without repository artifacts"

# No Pages deployment, publishing credentials, private data or privileged runner.

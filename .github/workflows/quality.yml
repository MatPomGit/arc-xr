name: ARC-XR offline research contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate policy, Pages and planned research structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR HEAD in isolated runner
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Validate ARC-XR research structure
        run: python3 scripts/validate_repository.py
      - name: Check documentation budgets
        run: python3 scripts/validate_documentation.py
      - name: Validate public Pages source
        run: python3 scripts/validate_pages.py
      - name: Validate GitHub Issues intake and JUMP contract
        run: python3 scripts/validate_issues.py
      - name: Audit ARC v2 migration plan without writes
        run: python3 -B scripts/audit_arc_v2_pilot.py
      - name: Install pinned research-schema validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/arc-v2"
          "${RUNNER_TEMP}/arc-v2/bin/python" -m pip install --disable-pip-version-check --no-input -r requirements-research.txt
      - name: Validate canonical ARC v2 registry and pinned TeX SHA
        run: |
          "${RUNNER_TEMP}/arc-v2/bin/python" -B scripts/validate_arc_v2_registry.py
      - name: Run all offline regression tests
        run: |
          "${RUNNER_TEMP}/arc-v2/bin/python" -m unittest discover -s tests -v
      - name: Build and verify curated GitHub Pages HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/arc-xr-mkdocs"
          "${RUNNER_TEMP}/arc-xr-mkdocs/bin/python" -m pip install --disable-pip-version-check mkdocs==1.6.1
          "${RUNNER_TEMP}/arc-xr-mkdocs/bin/python" -m mkdocs build --strict --clean
          python3 -B scripts/verify_site_output.py site

# No Pages deployment, publishing credentials, private data or privileged runner.
